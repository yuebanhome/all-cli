[package]
name = "sub2api-image"
version = "0.1.0"
edition = "2021"
description = "CLI for gpt-image-2 compatible image generation/edit API"
license = "MIT"
repository = "https://github.com/yuebanhome/all-cli"
readme = "README.md"
keywords = ["cli", "image", "ai", "openai", "gpt-image"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
anyhow = "1"
os_info = { version = "3", default-features = false }

[dev-dependencies]
httpmock = "0.7"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
base64 = "0.22"
serial_test = "3"
