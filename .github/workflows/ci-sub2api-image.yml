name: ci-sub2api-image

on:
  pull_request:
    paths:
      - "sub2api-image/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/ci-sub2api-image.yml"
  push:
    branches: [main]
    paths:
      - "sub2api-image/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/ci-sub2api-image.yml"

permissions:
  contents: read

concurrency:
  group: ci-sub2api-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/rust-ci.yml
    with:
      crate-path: sub2api-image
